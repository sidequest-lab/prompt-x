services:
  mongo:
    image: mongo:7
    container_name: promptx-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: promptx-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI}
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      CORS_ORIGIN: http://localhost:3000
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      REDIS_URL: ""
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: promptx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      API_BASE_URL_SERVER: http://backend:4000/api/v1
    ports:
      - "3000:3000"

  seed:
    build:
      context: ./backend
    profiles: ["seed"]
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/promptx
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      REDIS_URL: ""
      SEED_DEFAULT_PASSWORD: PromptX@2026
      SEED_RESET: "true"
    command: ["npm", "run", "seed:demo"]

volumes:
  mongo_data:
